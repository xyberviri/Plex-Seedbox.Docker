services:

  # BitTorrent Client (qBittorrent with Web UI)
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
    volumes:
      - ~/seedbox/config/qbittorrent:/config
      - ~/seedbox/data:/data
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  # Plex Media Server
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - VERSION=docker
      - PLEX_CLAIM=YOUR_CLAIM_CODE_HERE  # Get from plex.tv/claim
    volumes:
      - ~/seedbox/config/plex:/config
      - ~/seedbox/data/media:/data/media
    restart: unless-stopped
