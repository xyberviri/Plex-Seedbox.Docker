services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Detroit
      - VERSION=docker
      - PLEX_CLAIM=your_plex_claim_token_here # Get from plex.tv/claim
    volumes:
      - ./plex/config:/config
      - ./media/downloads/completed:/data/media

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - '8443:8443'
      - '6881:6881'
      - '6881:6881/udp'
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Detroit
      - WEBUI_PORT=8443
    volumes:
      - ./qbittorrent/config:/config
      - ./media/downloads:/data
